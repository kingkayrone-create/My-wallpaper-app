
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WALLZ Wallpapers</title>
<style>
body {
  margin: 0;
  background: #0b0d14;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 22px 16px;
  background: #171d2d;
}
h1 { color: #75a7ff; }
main { padding: 14px; }
input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #39435b;
  background: #1a2030;
  color: white;
  font-size: 16px;
}
#gallery {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}
.card {
  background: #191f30;
  padding: 8px;
  border-radius: 12px;
}
.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
}
.card a {
  display: block;
  background: #397bff;
  color: white;
  padding: 10px 3px;
  text-align: center;
  text-decoration: none;
  border-radius: 8px;
  font-size: 13px;
}
</style>
</head>
<body>
<header>
  <h1>WALLZ ✦</h1>
  <p>Your next favourite wallpaper.</p>
</header>
<main>
  <input id="search" placeholder="Search wallpapers...">
  <div id="gallery"></div>
</main>
<script>
const wallpapers = [
  ["Blue Mountains","photo-1500530855697-b586d89ba3ee"],
  ["Space","photo-1446776811953-b23d57bd21aa"],
  ["Ocean","photo-1518837695005-2083093ee35b"],
  ["Night Sky","photo-1475274047050-1d0c0975c63e"],
  ["Forest","photo-1448375240586-882707db888b"],
  ["Mountains","photo-1464822759023-fed622ff2c3b"]
];

function render() {
  const term = document.getElementById("search")
    .value.toLowerCase();

  document.getElementById("gallery").innerHTML =
    wallpapers.filter(w => w[0].toLowerCase().includes(term))
    .map(w => {
      const url = "https://images.unsplash.com/" +
        w[1] + "?auto=format&fit=crop&w=800&q=85";
      return `<div class="card">
        <img src="${url}" alt="${w[0]}">
        <p>${w[0]}</p>
        <a href="${url}" target="_blank" rel="noopener">
          Open / Save
        </a>
      </div>`;
    }).join("");
}

document.getElementById("search")
  .addEventListener("input", render);
render();
</script>
</body>
</html>
