
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WALLZ - Wallpapers</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:24px 16px;text-align:center;background:#141c32}
h1{margin:0;color:#62a5ff;font-size:36px}
header p{color:#bdc9df}
main{max-width:1000px;margin:auto;padding:16px}
input,select,button{padding:12px;border:0;border-radius:10px;font-size:15px}
input,select{background:#202b43;color:white;width:100%;margin:5px 0 12px}
button{cursor:pointer;background:#3985ff;color:white;font-weight:bold}
.tools,.upload{background:#141c32;padding:15px;border-radius:15px;margin-bottom:16px}
.categories{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.categories button{background:#263550}
.categories button.active{background:#3985ff}
.upload label{display:block;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.card{background:#141c32;border-radius:14px;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover;display:block}
.card h3{font-size:15px;margin:10px}
.actions{display:flex;gap:6px;padding:0 8px 10px}
.actions button{flex:1;padding:9px 5px;font-size:13px}
.delete{background:#d94455}
.note{color:#bdc9df;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<header>
<h1>WALLZ</h1>
<p>Find your next wallpaper</p>
</header>
<main>
<section class="tools">
<input id="search" placeholder="Search wallpapers..." />
<div class="categories" id="categories">
<button class="active" data-cat="All">All</button>
<button data-cat="Anime">Anime</button>
<button data-cat="Gaming">Gaming</button>
<button data-cat="Cars">Cars</button>
<button data-cat="Nature">Nature</button>
</div>
</section>

<section class="upload">
<h2>＋ Add a wallpaper</h2>
<p class="note">Choose a picture from your Gallery, give it a name and select a category.</p>
<label for="photo">Choose picture</label>
<input id="photo" type="file" accept="image/*">
<label for="title">Wallpaper name</label>
<input id="title" placeholder="Enter a name">
<label for="category">Category</label>
<select id="category">
<option>Anime</option><option>Gaming</option>
<option>Cars</option><option>Nature</option>
</select>
<button id="add">Add wallpaper</button>
<p class="note" id="message">Your added pictures are saved in this browser only.</p>
</section>

<div class="grid" id="gallery"></div>
</main>
<script>
const starter = [
{title:"Anime wallpaper",category:"Anime",url:"https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80"},
{title:"Gaming setup",category:"Gaming",url:"https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80"},
{title:"Sports car",category:"Cars",url:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80"},
{title:"Mountain nature",category:"Nature",url:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80"}
];
let chosen = "All";
let custom = [];
const gallery = document.getElementById("gallery");
const search = document.getElementById("search");
const message = document.getElementById("message");

function render(){
 gallery.innerHTML="";
 const list=[...starter,...custom].filter(w=>
 (chosen==="All"||w.category===chosen)&&
 w.title.toLowerCase().includes(search.value.toLowerCase())
 );
 if(!list.length){gallery.textContent="No wallpapers found.";return}
 list.forEach((w,index)=>{
  const card=document.createElement("article");
  card.className="card";
  const img=document.createElement("img");
  img.src=w.url;img.alt=w.title;img.loading="lazy";
  const name=document.createElement("h3");name.textContent=w.title;
  const actions=document.createElement("div");actions.className="actions";
  const download=document.createElement("button");
  download.textContent="Download";
  download.onclick=()=>{
   const a=document.createElement("a");
   a.href=w.url;a.download=w.title.replace(/[^a-z0-9]/gi,"-")+".jpg";
   a.target="_blank";a.rel="noopener";
   document.body.appendChild(a);a.click();a.remove();
  };
  actions.appendChild(download);
  if(w.custom){
   const del=document.createElement("button");
   del.textContent="Delete";del.className="delete";
   del.onclick=()=>{custom.splice(custom.indexOf(w),1);save();render()};
   actions.appendChild(del);
  }
  card.append(img,name,actions);gallery.appendChild(card);
 });
}
function save(){
 try{localStorage.setItem("wallzCustom",JSON.stringify(custom))}
 catch(e){message.textContent="Storage is full. Remove a large picture and try again."}
}
try{custom=JSON.parse(localStorage.getItem("wallzCustom")||"[]")}
catch(e){custom=[]}

document.getElementById("categories").addEventListener("click",e=>{
 if(e.target.tagName!=="BUTTON")return;
 chosen=e.target.dataset.cat;
 document.querySelectorAll(".categories button").forEach(b=>b.classList.toggle("active",b===e.target));
 render();
});
search.addEventListener("input",render);

document.getElementById("add").onclick=()=>{
 const file=document.getElementById("photo").files[0];
 const title=document.getElementById("title").value.trim();
 const category=document.getElementById("category").value;
 if(!file||!title){message.textContent="Choose a picture and enter a name first.";return}
 if(!file.type.startsWith("image/")){message.textContent="Please choose an image.";return}
 if(file.size>2*1024*1024){message.textContent="Please choose an image smaller than 2 MB.";return}
 const reader=new FileReader();
 reader.onload=()=>{
  custom.push({title,category,url:reader.result,custom:true});
  save();render();
  document.getElementById("photo").value="";
  document.getElementById("title").value="";
  message.textContent="Wallpaper added on this browser!";
 };
 reader.readAsDataURL(file);
};
render();
</script>
</body>
</html>
