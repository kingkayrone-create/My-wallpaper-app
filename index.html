
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d14">
<title>WALLZ - Wallpapers</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0d14;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 16px;
  background: linear-gradient(135deg, #17213a, #101522);
  border-bottom: 1px solid #283651;
}

h1 {
  color: #75a7ff;
  margin: 0 0 8px;
  font-size: 30px;
}

header p {
  color: #c4cce0;
  margin: 0;
}

main {
  padding: 14px;
  max-width: 1000px;
  margin: auto;
}

#search {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #39435b;
  background: #1a2030;
  color: white;
  font-size: 16px;
}

#categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 15px 0 8px;
}

#categories button {
  flex-shrink: 0;
  padding: 10px 14px;
  border: 1px solid #39435b;
  border-radius: 22px;
  background: #191f30;
  color: white;
  font-size: 14px;
}

#categories button.active {
  background: #397bff;
  border-color: #397bff;
}

#gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.card {
  background: #191f30;
  padding: 8px;
  border: 1px solid #29344b;
  border-radius: 14px;
  min-width: 0;
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 9px;
  display: block;
  background: #252c3b;
}

.card p {
  font-size: 14px;
  font-weight: bold;
  margin: 11px 2px;
}

.download {
  display: block;
  width: 100%;
  padding: 11px 4px;
  background: #397bff;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
}

.download:active {
  background: #245ac7;
}

#message {
  color: #b9c7e6;
  text-align: center;
  padding: 20px 0;
  font-size: 14px;
}

footer {
  text-align: center;
  color: #8b96ad;
  padding: 25px 10px;
  font-size: 12px;
}

@media (min-width: 650px) {
  #gallery {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
</style>
</head>

<body>
<header>
  <h1>WALLZ ✦</h1>
  <p>Find your next favourite wallpaper.</p>
</header>

<main>
  <input
    id="search"
    type="search"
    placeholder="🔍 Search wallpapers..."
    aria-label="Search wallpapers"
  >

  <div id="categories"></div>
  <div id="gallery"></div>
  <div id="message" role="status"></div>
</main>

<footer>WALLZ ✦ Make your screen yours.</footer>

<script>
const wallpapers = [
  { name: "Anime Art", cat: "Anime", id: "photo-1578632767115-351597cf2477" },
  { name: "Anime Style", cat: "Anime", id: "photo-1614583225154-5fc4b6fb7e90" },
  { name: "Gaming Setup", cat: "Gaming", id: "photo-1542751371-adc38448a05e" },
  { name: "Gaming Lights", cat: "Gaming", id: "photo-1593305841991-05c297ba4575" },
  { name: "Sports Car", cat: "Cars", id: "photo-1503376780353-7e6692767b70" },
  { name: "Supercar", cat: "Cars", id: "photo-1492144534655-ae79c964c9d7" },
  { name: "Blue Mountains", cat: "Nature", id: "photo-1500530855697-b586d89ba3ee" },
  { name: "Space", cat: "Nature", id: "photo-1446776811953-b23d57bd21aa" },
  { name: "Ocean", cat: "Nature", id: "photo-1518837695005-2083093ee35b" },
  { name: "Night Sky", cat: "Nature", id: "photo-1475274047050-1d0c0975c63e" },
  { name: "Forest", cat: "Nature", id: "photo-1448375240586-882707db888b" },
  { name: "Mountains", cat: "Nature", id: "photo-1464822759023-fed622ff2c3b" }
];

const categories = ["All", "Anime", "Gaming", "Cars", "Nature"];
let selected = "All";

function imageURL(wallpaper) {
  return "https://images.unsplash.com/" + wallpaper.id +
    "?auto=format&fit=crop&w=1000&q=90";
}

function makeCategories() {
  const container = document.getElementById("categories");
  container.innerHTML = "";

  categories.forEach(cat => {
    const button = document.createElement("button");
    button.textContent = (cat === "All" ? "✨ " : "") + cat;
    button.className = selected === cat ? "active" : "";
    button.setAttribute("aria-pressed", selected === cat);

    button.addEventListener("click", () => {
      selected = cat;
      makeCategories();
      render();
    });

    container.appendChild(button);
  });
}

function render() {
  const term = document.getElementById("search").value
    .trim().toLowerCase();

  const shown = wallpapers.filter(w =>
    (selected === "All" || w.cat === selected) &&
    (w.name.toLowerCase().includes(term) ||
     w.cat.toLowerCase().includes(term))
  );

  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  document.getElementById("message").textContent =
    shown.length ? "" : "No wallpapers found. Try another search.";

  shown.forEach(w => {
    const url = imageURL(w);
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = url;
    img.alt = w.name;
    img.loading = "lazy";

    img.addEventListener("error", () => {
      img.alt = w.name + " - image could not load";
    });

    const title = document.createElement("p");
    title.textContent = w.name;

    const link = document.createElement("a");
    link.className = "download";
    link.href = url;
    link.textContent = "⬇ Download";
    link.target = "_blank";
    link.rel = "noopener";

    link.addEventListener("click", async event => {
      event.preventDefault();
      link.textContent = "Preparing download...";

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Image unavailable");

        const blob = await response.blob();
        const objectURL = URL.createObjectURL(blob);
        const downloadLink = document.createElement("a");

        downloadLink.href = objectURL;
        downloadLink.download =
          w.name.toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".jpg";

        document.body.appendChild(downloadLink);
        downloadLink.click();
        downloadLink.remove();

        setTimeout(() => URL.revokeObjectURL(objectURL), 60000);
        link.textContent = "⬇ Download";
      } catch (error) {
        link.textContent = "Open image to save";
        window.open(url, "_blank", "noopener");

        link.onclick = null;
        link.addEventListener("click", e => {
          e.preventDefault();
          window.open(url, "_blank", "noopener");
        });
      }
    });

    card.appendChild(img);
    card.appendChild(title);
    card.appendChild(link);
    gallery.appendChild(card);
  });
}

document.getElementById("search").addEventListener("input", render);

makeCategories();
render();
</script>
</body>
</html>
