
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080e20">
<title>WALLZ Wallpapers</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;color:white;
 font-family:Arial,sans-serif;
 background:radial-gradient(circle at top,#203c75,#090d1d 65%);
 min-height:100vh
}
.glass{
 background:rgba(255,255,255,.09);
 border:1px solid rgba(255,255,255,.17);
 backdrop-filter:blur(25px);
 -webkit-backdrop-filter:blur(25px);
 border-radius:22px;
 box-shadow:0 12px 35px #0005
}
header{padding:18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:900;letter-spacing:3px}
.logo span{color:#5bd5ff}
button,input,select{font:inherit}
button{
 color:white;background:#ffffff12;border:1px solid #ffffff25;
 padding:11px 14px;border-radius:13px;cursor:pointer
}
.primary{background:linear-gradient(120deg,#159eff,#835cff);border:0}
.hero{padding:25px;margin-top:18px}
h1{font-size:38px;margin:10px 0}
p{color:#c1cce5;line-height:1.5}
input,select{
 background:#0c1428;color:white;border:1px solid #ffffff25;
 border-radius:12px;padding:13px;width:100%;margin:6px 0
}
.filters{display:flex;gap:8px;overflow:auto;margin:18px 0}
.filters button{white-space:nowrap}
.filters .active{background:linear-gradient(120deg,#159eff,#835cff)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wall{overflow:hidden}
.wall img{width:100%;height:210px;object-fit:cover;display:block}
.info{padding:12px}
.info small{color:#bac6df}
.actions{display:flex;gap:7px;margin-top:10px}
.actions button{flex:1;padding:9px 5px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wall img{height:280px}}
#updateBox{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:20px}
.dialog{max-width:380px;width:100%;padding:24px}
#toast{position:fixed;bottom:15px;left:5%;width:90%;text-align:center;padding:12px;background:#172440;border-radius:12px;display:none}
</style>
</head>
<body>

<header class="glass">
 <div class="logo">WALL<span>Z</span></div>
 <button class="primary" onclick="document.getElementById('upload').click()">＋ Add</button>
</header>

<section class="hero glass">
 <small style="color:#72d8ff;letter-spacing:2px">YOUR SCREEN. YOUR STYLE.</small>
 <h1>Find your next wallpaper.</h1>
 <p>Discover wallpapers for your phone and save your favourites.</p>
 <input id="search" placeholder="Search wallpapers..." oninput="render()">
 <input id="upload" type="file" accept="image/*" hidden onchange="addWallpaper(event)">
</section>

<nav class="filters" id="filters"></nav>
<h2 id="heading">Explore wallpapers</h2>
<div id="grid" class="grid"></div>

<div id="updateBox">
 <div class="dialog glass">
  <h2>✨ WALLZ Update</h2>
  <p id="updateMessage">A new version is ready!</p>
  <button onclick="document.getElementById('updateBox').style.display='none'">Later</button>
  <button class="primary" onclick="applyUpdate()">Update now</button>
 </div>
</div>
<div id="toast"></div>

<script>
const categories=['All','Anime','Gaming','Cars','Nature','My uploads'];

const starter=[
 {id:'1',title:'Mountain Escape',category:'Nature',image:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80'},
 {id:'2',title:'Blue Ocean',category:'Nature',image:'https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=700&q=80'},
 {id:'3',title:'Dream Car',category:'Cars',image:'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=700&q=80'},
 {id:'4',title:'Space Galaxy',category:'Gaming',image:'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=700&q=80'},
 {id:'5',title:'Forest',category:'Nature',image:'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=700&q=80'},
 {id:'6',title:'Night City',category:'Gaming',image:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=700&q=80'}
];

let selected='All';
let uploads=loadUploads();

function loadUploads(){
 try{return JSON.parse(localStorage.getItem('wallz_uploads')||'[]')}
 catch(e){return []}
}
function saveUploads(){
 try{
  localStorage.setItem('wallz_uploads',JSON.stringify(uploads));
  return true;
 }catch(e){
  notify('Storage full. Try a smaller image.');
  return false;
 }
}
function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function notify(message){
 const t=document.getElementById('toast');
 t.textContent=message;t.style.display='block';
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.style.display='none',2600);
}
function allWalls(){return [...starter,...uploads]}
function renderFilters(){
 const f=document.getElementById('filters');
 f.innerHTML=categories.map(c=>
  `<button class="${c===selected?'active':''}" onclick="chooseCategory('${c}')">${c}</button>`
 ).join('');
}
function chooseCategory(c){selected=c;renderFilters();render()}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const list=allWalls().filter(w=>
  (selected==='All'||(selected==='My uploads'?w.own:w.category===selected))&&
  (w.title+' '+w.category).toLowerCase().includes(q)
 );
 document.getElementById('heading').textContent=selected==='All'?'Explore wallpapers':selected;
 const grid=document.getElementById('grid');
 if(!list.length){grid.innerHTML='<p>No wallpapers found.</p>';return}
 grid.innerHTML=list.map(w=>`
  <article class="wall glass">
   <img loading="lazy" src="${esc(w.image)}" alt="${esc(w.title)}">
   <div class="info">
    <strong>${esc(w.title)}</strong><br>
    <small>${esc(w.category)}</small>
    <div class="actions">
     <button class="primary" onclick="downloadWall('${w.id}')">↓ Save</button>
     ${w.own?`<button onclick="deleteWall('${w.id}')">Delete</button>`:''}
    </div>
   </div>
  </article>`).join('');
}
async function downloadWall(id){
 const w=allWalls().find(x=>x.id===id);
 if(!w)return;
 try{
  const r=await fetch(w.image);
  if(!r.ok)throw Error('Fetch failed');
  const blob=await r.blob();
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=(w.title||'WALLZ').replace(/[^\w-]/g,'_')+'.jpg';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  notify('Download started!');
 }catch(e){
  notify('Opening image. Use the image menu to save it.');
  window.open(w.image,'_blank');
 }
}
function addWallpaper(event){
 const file=event.target.files[0];
 if(!file)return;
 if(!file.type.startsWith('image/')){notify('Choose an image.');return}
 if(file.size>3*1024*1024){notify('Choose an image under 3 MB.');return}
 const reader=new FileReader();
 reader.onload=()=>{
  const title=prompt('Wallpaper name?',file.name.replace(/\.[^.]+$/,''))||file.name;
  uploads.unshift({
   id:'u'+Date.now(),title,category:prompt('Category: Anime, Gaming, Cars, Nature or Other','Other')||'Other',
   image:reader.result,own:true
  });
  if(saveUploads()){selected='My uploads';renderFilters();render();notify('Wallpaper added!')}
 };
 reader.readAsDataURL(file);event.target.value='';
}
function deleteWall(id){
 if(!confirm('Delete this wallpaper?'))return;
 uploads=uploads.filter(w=>w.id!==id);
 if(saveUploads())render();
}
renderFilters();render();

/* UPDATE CHECK:
   Change version.json on GitHub whenever you publish an update. */
let latestVersion='';
async function checkUpdate(){
 try{
  const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)return;
  const data=await r.json();
  if(!data.version)return;
  const seen=localStorage.getItem('wallz_version');
  if(!seen){localStorage.setItem('wallz_version',data.version);return}
  if(seen!==data.version){
   latestVersion=data.version;
   document.getElementById('updateMessage').textContent=
    data.message||'A new WALLZ update is ready.';
   document.getElementById('updateBox').style.display='flex';
  }
 }catch(e){}
}
function applyUpdate(){
 if(latestVersion)localStorage.setItem('wallz_version',latestVersion);
 const u=new URL(location.href);u.searchParams.set('refresh',Date.now());
 location.replace(u.href);
}
setTimeout(checkUpdate,2000);
setInterval(checkUpdate,60000);
</script>
</body>
</html>
