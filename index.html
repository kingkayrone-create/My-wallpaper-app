
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WALLZ Wallpapers</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0b0d14;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 20px 16px;
  background: #171d2d;
}
h1 { color: #75a7ff; margin-bottom: 5px; }
main { padding: 14px; }
input {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #39435b;
  background: #1a2030;
  color: white;
  font-size: 16px;
}
#categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 15px 0 5px;
}
#categories button {
  flex-shrink: 0;
  padding: 10px 13px;
  border: 1px solid #39435b;
  border-radius: 20px;
  background: #191f30;
  color: white;
}
#categories button.active {
  background: #397bff;
  border-color: #397bff;
}
#gallery {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 15px;
}
.card {
  background: #191f30;
  padding: 8px;
  border-radius: 12px;
  min-width: 0;
}
.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
}
.card p { font-size: 14px; }
.card a {
  display: block;
  background: #397bff;
  color: white;
  padding: 10px 3px;
  text-align: center;
  text-decoration: none;
  border-radius: 8px;
  font-size: 13px;
}
</style>
</head>
<body>
<header>
  <h1>WALLZ ✦</h1>
  <p>Find your next favourite wallpaper.</p>
</header>
<main>
  <input id="search" placeholder="Search wallpapers...">
  <div id="categories"></div>
  <div id="gallery"></div>
</main>
<script>
const wallpapers = [
  {name:"Anime Art",cat:"Anime",id:"photo-1578632767115-351597cf2477"},
  {name:"Anime Style",cat:"Anime",id:"photo-1614583225154-5fc4b6fb7e90"},
  {name:"Gaming Setup",cat:"Gaming",id:"photo-1542751371-adc38448a05e"},
  {name:"Gaming Lights",cat:"Gaming",id:"photo-1593305841991-05c297ba4575"},
  {name:"Sports Car",cat:"Cars",id:"photo-1503376780353-7e6692767b70"},
  {name:"Supercar",cat:"Cars",id:"photo-1492144534655-ae79c964c9d7"},
  {name:"Blue Mountains",cat:"Nature",id:"photo-1500530855697-b586d89ba3ee"},
  {name:"Space",cat:"Nature",id:"photo-1446776811953-b23d57bd21aa"},
  {name:"Ocean",cat:"Nature",id:"photo-1518837695005-2083093ee35b"},
  {name:"Night Sky",cat:"Nature",id:"photo-1475274047050-1d0c0975c63e"},
  {name:"Forest",cat:"Nature",id:"photo-1448375240586-882707db888b"},
  {name:"Mountains",cat:"Nature",id:"photo-1464822759023-fed622ff2c3b"}
];

let selected = "All";
const categories = ["All","Anime","Gaming","Cars","Nature"];

function makeCategories() {
  document.getElementById("categories").innerHTML =
    categories.map(cat =>
      `<button class="${selected === cat ? "active" : ""}"
       onclick="chooseCategory('${cat}')">${cat === "All" ? "✨ " : ""}${cat}</button>`
    ).join("");
}

function chooseCategory(cat) {
  selected = cat;
  makeCategories();
  render();
}

function render() {
  const term = document.getElementById("search").value.toLowerCase();
  const shown = wallpapers.filter(w =>
    (selected === "All" || w.cat === selected) &&
    (w.name.toLowerCase().includes(term) ||
     w.cat.toLowerCase().includes(term))
  );

  document.getElementById("gallery").innerHTML = shown.map(w => {
    const url = "https://images.unsplash.com/" + w.id +
      "?auto=format&fit=crop&w=800&q=85";
    return `<div class="card">
      <img src="${url}" alt="${w.name}" loading="lazy">
      <p>${w.name}</p>
      <a href="${url}" target="_blank" rel="noopener">Open / Save</a>
    </div>`;
  }).join("");

  if (!shown.length) {
    document.getElementById("gallery").innerHTML =
      "<p>No wallpapers found. Try another search.</p>";
  }
}

document.getElementById("search").addEventListener("input", render);
makeCategories();
render();
</script>
</body>
</html>
